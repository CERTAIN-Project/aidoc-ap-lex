abstract=The AIDOC-AP LEX Extension is a module of the AIDOC-AP application profile for legal and ethical requirements. It adds the terms needed to document how an AI system meets the obligations of providers and deployers in Articles 9 to 17, 72 and 73 of the EU AI Act and the ethical requirements of the Assessment List for Trustworthy AI (ALTAI), the OECD AI Principles and the gender requirements of CERTAIN deliverable D3.2: management systems, assessments, measures, compliance documents, incidents and the organisations and persons involved. The 180 requirements, their competency questions and the evidence an organisation is expected to keep are published with the module. The module imports the AIDOC-AP core without changing any core definition.
